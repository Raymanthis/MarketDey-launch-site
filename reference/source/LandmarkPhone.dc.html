<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet" />
</helmet>
<div style="position:relative;width:426px;height:898px;border-radius:70px;padding:4px;box-sizing:border-box;background:linear-gradient(135deg,#a29d96 0%,#5a5651 16%,#2f2d2b 50%,#5a5651 84%,#a29d96 100%);box-shadow:0 60px 90px -40px rgba(37,36,34,.6),inset 0 0 0 1px rgba(255,255,255,.2);font-family:'Lato',ui-sans-serif,system-ui,sans-serif">
  <div style="position:absolute;left:-3px;top:168px;width:4px;height:32px;border-radius:2px 0 0 2px;background:#55514c"></div>
  <div style="position:absolute;left:-3px;top:226px;width:4px;height:62px;border-radius:2px 0 0 2px;background:#55514c"></div>
  <div style="position:absolute;left:-3px;top:300px;width:4px;height:62px;border-radius:2px 0 0 2px;background:#55514c"></div>
  <div style="position:absolute;right:-3px;top:262px;width:4px;height:98px;border-radius:0 2px 2px 0;background:#55514c"></div>
  <div style="width:100%;height:100%;border-radius:66px;background:#050505;padding:8px;box-sizing:border-box">
    <div style="width:402px;height:874px;border-radius:58px;overflow:hidden;background:#000;position:relative">
      <x-import component-from-global-scope="IOSDevice" hint-size="402px,874px">
        <div style="height:100%;position:relative;overflow:hidden;background:#faf9f6;color:#252422;font-family:'Lato',ui-sans-serif,system-ui,sans-serif">
          <div style="display:flex;flex-direction:column;gap:14px;padding:58px 20px 34px">
            <div style="display:flex;align-items:center;gap:12px">
              <div style="flex:none;width:44px;height:44px;border-radius:22px;background:#fff;border:1px solid rgba(37,36,34,.08);display:flex;align-items:center;justify-content:center;font-size:20px"><i class="ri-close-line"></i></div>
              <div style="font-size:13px;font-weight:700;color:#403d39">Central Market · Sapele</div>
              <span style="margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px 0 7px;border-radius:12px;background:rgba(217,150,43,.16);color:#8a5a0b;font-size:11px;font-weight:800"><i class="ri-information-line"></i>Placeholder route</span>
            </div>
            <div style="font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.08">Check I’m here</div>
            <div style="display:flex;flex-direction:column;gap:8px">
              <div style="display:flex;gap:6px">
                <sc-for list="{{ segs }}" as="g" hint-placeholder-count="5"><div style="flex:1;height:5px;border-radius:3px;background:rgba(204,197,185,.5);overflow:hidden"><div style="height:100%;width:{{ g.w }};border-radius:3px;background:#4f772d;transition:width 1.6s cubic-bezier(.45,0,.2,1)"></div></div></sc-for>
              </div>
              <div style="font-size:13px;font-weight:700;color:#403d39">{{ progressLabel }}</div>
            </div>
            <div style="display:grid;grid-template-rows:{{ arrRows }};opacity:{{ arrOp }};transition:grid-template-rows .7s cubic-bezier(.2,.8,.2,1),opacity .5s"><div style="overflow:hidden;min-height:0">
              <div style="display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:20px;background:#a7c957;margin-bottom:2px">
                <div style="display:flex;align-items:center;gap:12px"><span style="flex:none;width:44px;height:44px;border-radius:22px;background:#252422;color:#a7c957;display:flex;align-items:center;justify-content:center;font-size:24px"><i class="ri-check-line"></i></span><div style="font-size:24px;font-weight:900;letter-spacing:-.03em">You’re at the gate</div></div>
                <div style="font-size:15px;line-height:1.4">Green gate with a painted arch, on your left.</div>
                <div style="height:48px;border-radius:24px;background:#252422;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700">Done</div>
              </div>
            </div></div>
            <div style="display:flex;flex-direction:column;gap:8px">
              <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
                <div style="display:flex;flex-direction:column;border-radius:{{ r.rad }};background:{{ r.bg }};border:1.5px solid {{ r.bd }};box-shadow:{{ r.sh }};transition:background .5s,border-color .5s,box-shadow .5s,border-radius .5s;overflow:hidden">
                  <div style="display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 14px">
                    <span style="position:relative;flex:none;width:28px;height:28px;border-radius:14px;box-sizing:border-box;background:{{ r.bBg }};border:1.5px solid {{ r.bBd }};color:{{ r.bFg }};transition:background .4s,border-color .4s,color .4s">
                      <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;opacity:{{ r.numOp }};transform:scale({{ r.numSc }});transition:opacity .25s,transform .3s">{{ r.n }}</span>
                      <i class="ri-check-line" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;opacity:{{ r.chkOp }};transform:scale({{ r.chkSc }}) rotate({{ r.chkRot }});transition:opacity .35s .2s,transform .55s .2s cubic-bezier(.3,1.6,.5,1)"></i>
                    </span>
                    <div style="flex:1;font-size:{{ r.fs }};font-weight:800;letter-spacing:-.02em;color:{{ r.fc }};transition:font-size .4s,color .4s">{{ r.name }}</div>
                    <div style="font-size:12px;font-weight:800;color:#386641;opacity:{{ r.seenOp }};transform:translateX({{ r.seenX }});transition:opacity .4s .35s,transform .5s .35s">Seen</div>
                  </div>
                  <div style="display:grid;grid-template-rows:{{ r.rows }};transition:grid-template-rows .65s cubic-bezier(.2,.8,.2,1)"><div style="overflow:hidden;min-height:0">
                    <div style="display:flex;flex-direction:column;gap:10px;padding:0 12px 12px;opacity:{{ r.bodyOp }};transition:opacity .4s">
                      <div style="height:128px;border-radius:14px;background:repeating-linear-gradient(135deg,rgba(37,36,34,.07) 0 8px,transparent 8px 16px);border:1px solid rgba(37,36,34,.08);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;font:10px/1.2 ui-monospace,Menlo,monospace;color:#403d39">photo · {{ r.photo }}</div>
                      <div style="font-size:15px;line-height:1.4;color:#403d39">{{ r.cue }}</div>
                      <div style="display:flex;gap:8px"><div style="flex:1;height:48px;border-radius:24px;background:#4f772d;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700">I see it</div><div style="flex:1;height:48px;border-radius:24px;border:1.5px solid rgba(37,36,34,.22);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700">Not yet</div></div>
                    </div>
                  </div></div>
                </div>
              </sc-for>
            </div>
          </div>
        </div>
      </x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:426,&quot;height&quot;:898},&quot;step&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:0,&quot;max&quot;:6,&quot;tsType&quot;:&quot;number&quot;}}">
const LM = [
  { name: 'Filling station', cue: 'Yellow canopy on your right. Keep going straight.', photo: 'canopy from the road' },
  { name: 'Water tank on stilts', cue: 'Tall water tank behind a fence, on your left.', photo: 'tank above the fence' },
  { name: 'Umbrella stalls', cue: 'Row of umbrellas on your right. Slow down here.', photo: 'umbrellas along the verge' },
  { name: 'St Paul’s Anglican Church', cue: 'White walls, blue roof, on your left. The main gate is 150 m further on, same side.', photo: 'church from the road' },
  { name: 'Market gate', cue: 'Green gate with a painted arch, on your left.', photo: 'gate and arch' }
];
class Component extends DCLogic {
  renderVals() {
    const s = this.props.step ?? 2;
    const arrived = s >= 6;
    const seen = arrived ? 5 : Math.max(0, s - 1);
    return {
      arrRows: arrived ? '1fr' : '0fr', arrOp: arrived ? 1 : 0,
      progressLabel: s === 0 ? 'Landmarks appear in the order you pass them' : arrived ? '5 of 5 seen' : seen + ' of 5 seen',
      segs: LM.map((_, i) => ({ w: arrived || i < seen ? '100%' : '0%' })),
      rows: LM.map((l, i) => { const n = i + 1, done = arrived || n < s, cur = !arrived && n === s;
        return { n, name: l.name, cue: l.cue, photo: l.photo,
          rad: cur ? '20px' : '16px', bg: done ? '#e4eed4' : '#fff', bd: cur ? '#4f772d' : done ? 'rgba(79,119,45,0)' : 'rgba(37,36,34,.08)', sh: cur ? '0 0 0 4px rgba(79,119,45,.12)' : '0 0 0 0 rgba(79,119,45,0)',
          bBg: cur || done ? '#4f772d' : 'rgba(79,119,45,0)', bBd: cur || done ? '#4f772d' : 'rgba(37,36,34,.22)', bFg: cur || done ? '#fff' : '#403d39',
          numOp: done ? 0 : 1, numSc: done ? 0.4 : 1, chkOp: done ? 1 : 0, chkSc: done ? 1 : 0.3, chkRot: done ? '0deg' : '-60deg',
          fs: cur ? '18px' : '15px', fc: cur || done ? '#252422' : '#403d39', seenOp: done ? 1 : 0, seenX: done ? '0px' : '10px',
          rows: cur ? '1fr' : '0fr', bodyOp: cur ? 1 : 0 }; })
    };
  }
}
</script>
</body>
</html>
